name: Monorepo CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ecosystem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          pip install -e ./backend[dev]
      - name: Lint with Ruff
        run: ruff check backend data_ml
      - name: Run Migrations & Pytest
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/ecosystem_test
          SESSION_SECRET: ci-test-secret-key-minimum-32-chars
        run: |
          cd backend
          alembic upgrade head
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Typecheck Frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
